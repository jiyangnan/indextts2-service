[project]
name = "indextts2-service"
version = "2.0.0"
description = "IndexTTS2 零样本语音合成微服务"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    # 基础依赖（所有平台）
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # 存储和缓存
    "boto3>=1.34.0",
    "redis>=5.0.0",
    # IndexTTS2 相关依赖（仅 Linux + GPU）
    # macOS 开发环境使用 Mock 模式
    "torch>=2.1.0; sys_platform == 'linux'",
    "torchaudio>=2.1.0; sys_platform == 'linux'",
    "librosa>=0.10.0; sys_platform == 'linux'",
    "soundfile>=0.12.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
